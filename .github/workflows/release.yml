name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ha-puppet

jobs:
  release:
    name: Build, publish and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag and changelog
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve upstream revision
        id: pin
        run: |
          sha="$(tr -d '[:space:]' < UPSTREAM)"
          echo "$sha" | grep -Eqx '[0-9a-f]{40}'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: balloob/home-assistant-addons
          ref: ${{ steps.pin.outputs.sha }}
          path: upstream
          persist-credentials: false

      - name: Read upstream version
        id: up
        run: |
          version="$(yq -r '.version' upstream/puppet/config.yaml)"
          test -n "$version" && test "$version" != null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=ha-puppet
            org.opencontainers.image.description=Standalone container image of balloob's Puppet, the Home Assistant dashboard screenshot service
            org.opencontainers.image.licenses=Apache-2.0
            io.github.alexdelprete.ha-puppet.upstream.source=https://github.com/balloob/home-assistant-addons
            io.github.alexdelprete.ha-puppet.upstream.revision=${{ steps.pin.outputs.sha }}
            io.github.alexdelprete.ha-puppet.upstream.version=${{ steps.up.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            UPSTREAM_REVISION=${{ steps.pin.outputs.sha }}
            UPSTREAM_VERSION=${{ steps.up.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          DIGEST: ${{ steps.build.outputs.digest }}
          UPSTREAM_SHA: ${{ steps.pin.outputs.sha }}
          UPSTREAM_VERSION: ${{ steps.up.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            cat notes.md
            echo
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            tick='`'
            printf 'Tags:'
            echo "$TAGS" | sed 's|.*:||' | while read -r t; do printf ' %s%s%s' "$tick" "$t" "$tick"; done
            echo
            echo
            echo "Platforms: linux/amd64, linux/arm64"
            echo
            echo "Upstream Puppet ${UPSTREAM_VERSION} ([balloob/home-assistant-addons@${UPSTREAM_SHA:0:7}](https://github.com/balloob/home-assistant-addons/tree/${UPSTREAM_SHA}/puppet))"
            echo
            echo "## Verify"
            echo
            echo '```'
            echo "gh attestation verify oci://${IMAGE}:${VERSION} --owner ${GITHUB_REPOSITORY_OWNER}"
            echo "cosign verify ${IMAGE}:${VERSION} --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > release.md
          set --
          if [ "$PRERELEASE" = true ]; then set -- --prerelease; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release.md "$@"
